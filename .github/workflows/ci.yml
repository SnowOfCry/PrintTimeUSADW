name: CI — PrintTimeUSA ELT Data Warehouse

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:
    branches: ["main", "develop"]

jobs:

  # ── Lint & Type Check ────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check ingestion/ tests/

      - name: Ruff format check
        run: ruff format --check ingestion/ tests/

      - name: Mypy type check
        run: mypy ingestion/ --ignore-missing-imports

  # ── Unit Tests ───────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/unit/ -v --cov=ingestion --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ── Docker Compose Validation ─────────────────────────────────────────────
  docker-compose-validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy env example
        run: cp .env.example .env

      - name: Validate docker-compose.yml syntax
        run: docker compose config --quiet

  # ── dbt Validate (Databricks dialect) ─────────────────────────────────────
  # After the Postgres -> Databricks migration the warehouse target is Databricks,
  # so this job validates the dbt project against the `databricks` profile with
  # `dbt parse`. Parse renders every model/macro/test and builds the manifest —
  # catching Jinja errors, bad `ref`s, contract shape, and missing files — WITHOUT
  # a live warehouse or secrets (parse does not connect). This would have caught
  # the tests/ dialect miss and the FILTER-cast mangle during the migration.
  #
  # Note: parse validates COMPILATION, not SQL execution. For full fidelity (SQL +
  # data tests actually run on Databricks), add a `dbt build` step here using repo
  # secrets DBRICKS_HOST / DBRICKS_HTTP_PATH / DBRICKS_TOKEN against a CI warehouse.
  # Omitted for now to keep CI secret-free.
  dbt-validate:
    name: dbt Parse (Databricks)
    runs-on: ubuntu-latest
    needs: lint
    env:
      # dbt renders ALL outputs in profiles.yml at load time, so every env_var it
      # references must be set. These are DUMMIES — `dbt parse` never connects.
      DBRICKS_HOST: dummy.cloud.databricks.com
      DBRICKS_HTTP_PATH: /sql/1.0/warehouses/dummy
      DBRICKS_TOKEN: dummy
      DBT_CATALOG: printtime_dw
      DBT_SCHEMA: silver
      DBT_HOST: localhost
      DBT_PORT: "5432"
      DBT_DATABASE: printtime_dw
      DBT_USER: dummy
      DBT_PASSWORD: dummy
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dbt-databricks (pinned to the project version)
        run: pip install "dbt-databricks==1.12.5"

      - name: dbt parse — validate all models/macros/tests compile (Databricks dialect)
        working-directory: dbt/printtime_dw
        run: dbt parse --target databricks --profiles-dir . --no-version-check
