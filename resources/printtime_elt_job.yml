# =============================================================================
# resources/printtime_elt_job.yml — the dbt orchestration job (as code)
# -----------------------------------------------------------------------------
# Mirrors the Workflow built in the UI: one dbt task that runs silver -> gold ->
# test against the SQL warehouse, pulling the dbt project from GitHub. `dbt test`
# runs last and gates the job (the task fails if any test fails).
#
# The managed dbt task auto-generates its own profiles.yml from catalog + schema
# + warehouse_id, so no token is needed in the job (it uses the job's identity).
# =============================================================================
resources:
  jobs:
    printtime_elt_databricks:
      name: printtime_elt_databricks

      # Daily at 06:00. Paused by default — set pause_status: UNPAUSED (or toggle
      # in the UI) to actually schedule it. Keeps Free-Edition capacity for demos.
      schedule:
        quartz_cron_expression: "0 0 6 ? * *"
        timezone_id: America/Chicago
        pause_status: PAUSED

      email_notifications:
        on_failure:
          - ${var.alert_email}

      # The job clones the repo at run time; the dbt task runs from project_directory.
      git_source:
        git_url: https://github.com/SnowOfCry/PrintTimeUSADW
        git_provider: gitHub
        git_branch: migrate/databricks

      tasks:
        - task_key: dbt_build_and_test
          dbt_task:
            project_directory: dbt/printtime_dw
            catalog: printtime_dw
            schema: silver
            warehouse_id: ${var.warehouse_id}
            commands:
              - "dbt run --select silver --vars '{silver_batch_id: 1}'"
              - "dbt run --select gold --vars '{gold_batch_ids: {gold.dimensions: 1, gold.fact_customer_behavior_snapshot: 1, gold.fact_payments: 1, gold.fact_retail_sales: 1}}'"
              - "dbt test"
          # Serverless compute runs the dbt CLI; the SQL runs on the warehouse above.
          # NOTE: the serverless `environments` block (client version + deps) is the
          # part most likely to need a tweak for your workspace — run
          # `databricks bundle validate` to confirm, or `bundle generate job` to
          # capture the exact live spec. If serverless dbt tasks aren't available,
          # swap environment_key for a small job cluster (new_cluster).
          environment_key: dbt_default

      environments:
        - environment_key: dbt_default
          spec:
            client: "1"
            dependencies:
              - dbt-databricks==1.12.5
