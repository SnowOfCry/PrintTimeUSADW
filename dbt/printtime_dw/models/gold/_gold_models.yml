version: 2

# =============================================================================
# _gold_models.yml
# dbt model contracts + tests for the gold (Kimball star-schema) layer.
# Each contract enforces the exact shape of sql/gold/002_create_gold_tables.sql:
# column names, data types, NOT NULL constraints, and the primary key.
# Columns are listed in the order the model's SELECT emits them.
# Add one model block per .sql file in this folder.
# =============================================================================

models:

  # ── gold.dim_date (Type 0 — generated calendar) ─────────────────────────────
  - name: dim_date
    description: "Conformed calendar dimension (YYYYMMDD smart key). Generated 2020-2030 + a -1 Not Provided member. Referenced directly and via role-playing date views (ADR-010)."
    config:
      contract:
        enforced: true
    columns:
      - name: date_key
        data_type: integer
        constraints:
          - type: not_null
          - type: primary_key
        data_tests:
          - unique
          - not_null

      - name: date
        data_type: date
        constraints:
          - type: not_null

      - name: full_date_description
        data_type: varchar(50)

      - name: day_of_week
        data_type: varchar(10)

      - name: day_number_in_calendar_month
        data_type: smallint

      - name: last_day_in_month_indicator
        data_type: varchar(3)

      - name: calendar_week_ending_date
        data_type: date

      - name: calendar_month_name
        data_type: varchar(10)

      - name: calendar_month_number_in_year
        data_type: smallint

      - name: calendar_quarter
        data_type: smallint

      - name: calendar_year_quarter
        data_type: varchar(7)

      - name: calendar_year
        data_type: smallint

      - name: calendar_year_month
        data_type: varchar(7)

      - name: holiday_indicator
        data_type: varchar(20)
        data_tests:
          - not_null

      - name: weekday_indicator
        data_type: varchar(10)
        data_tests:
          - accepted_values:
              values: ['Weekday', 'Weekend', 'Unknown']

      - name: etl_load_timestamp
        data_type: timestamp
        constraints:
          - type: not_null

      - name: etl_updated_timestamp
        data_type: timestamp
        constraints:
          - type: not_null

  # ── gold.dim_payment_type (Type 1 — overwrite) ─────────────────────────────
  - name: dim_payment_type
    description: "Payment-type dimension (Type 1 overwrite-in-place). Feeds gold.fact_payments. dbt-managed integer surrogate key; -1 Not Provided member."
    config:
      contract:
        enforced: true
    columns:
      - name: payment_type_key
        data_type: integer
        constraints:
          - type: not_null
          - type: primary_key
        data_tests:
          - unique
          - not_null

      - name: type_code
        data_type: varchar(20)
        constraints:
          - type: not_null
        data_tests:
          - accepted_values:
              values: ['DEPOSIT', 'BALANCE', 'FULL', 'REFUND', 'ADJUSTMENT', 'Not Provided']

      - name: type_name
        data_type: varchar(50)

      - name: description
        data_type: varchar(200)

      - name: etl_load_timestamp
        data_type: timestamp
        constraints:
          - type: not_null

      - name: etl_updated_timestamp
        data_type: timestamp
        constraints:
          - type: not_null

      - name: is_deleted
        data_type: boolean
        constraints:
          - type: not_null

  # ── gold.dim_payment_method (Type 2 — SCD2, ADR-015) ───────────────────────
  - name: dim_payment_method
    description: "Payment-method dimension (SCD Type 2). One row per method version; current version has is_current = true. Matched on the durable source_record_id; change detected via SHA-256 record_hash."
    config:
      contract:
        enforced: true
    columns:
      - name: payment_method_key
        data_type: integer
        constraints:
          - type: not_null
          - type: primary_key
        data_tests:
          - unique
          - not_null

      - name: method_code
        data_type: varchar(20)
        constraints:
          - type: not_null

      - name: method_name
        data_type: varchar(50)

      - name: method_type
        data_type: varchar(30)

      - name: is_active
        data_type: boolean

      - name: record_hash
        data_type: char(64)

      - name: source_system
        data_type: varchar(50)

      - name: source_record_id
        data_type: varchar(100)

      - name: etl_batch_id
        data_type: varchar(50)

      - name: etl_load_timestamp
        data_type: timestamp
        constraints:
          - type: not_null

      - name: etl_updated_timestamp
        data_type: timestamp
        constraints:
          - type: not_null

      - name: valid_from
        data_type: date

      - name: valid_to
        data_type: date

      - name: is_current
        data_type: boolean
        constraints:
          - type: not_null

      - name: row_version
        data_type: integer
        constraints:
          - type: not_null

      - name: is_complete
        data_type: boolean
        constraints:
          - type: not_null

      - name: is_validated
        data_type: boolean
        constraints:
          - type: not_null

      - name: dq_issue_flag
        data_type: boolean
        constraints:
          - type: not_null

      - name: dq_issue_description
        data_type: varchar(500)

      - name: is_deleted
        data_type: boolean
        constraints:
          - type: not_null

      - name: deleted_timestamp
        data_type: timestamp

  # ── gold.dim_product (Type 2 — SCD2, ADR-015) ──────────────────────────────
  - name: dim_product
    description: "Product dimension (SCD Type 2). One row per product version; category/department attributes are denormalized from silver.product_category and silver.department. Price and markup changes version the row for point-in-time margin analysis."
    config:
      contract:
        enforced: true
    columns:
      - name: product_key
        data_type: integer
        constraints:
          - type: not_null
          - type: primary_key
        data_tests:
          - unique
          - not_null

      - name: sku_number
        data_type: varchar(50)
        constraints:
          - type: not_null

      - name: product_description
        data_type: varchar(200)

      - name: brand_description
        data_type: varchar(100)

      - name: category_description
        data_type: varchar(100)

      - name: department_number
        data_type: varchar(20)

      - name: department_description
        data_type: varchar(100)

      - name: markup
        data_type: numeric(8,4)

      - name: standard_price
        data_type: numeric(12,2)

      - name: local_made_indicator
        data_type: varchar(20)
        data_tests:
          - accepted_values:
              values: ['Local', 'Not Local', 'Not Provided']

      - name: record_hash
        data_type: char(64)

      - name: source_system
        data_type: varchar(50)

      - name: source_record_id
        data_type: varchar(100)

      - name: etl_batch_id
        data_type: varchar(50)

      - name: etl_load_timestamp
        data_type: timestamp
        constraints:
          - type: not_null

      - name: etl_updated_timestamp
        data_type: timestamp
        constraints:
          - type: not_null

      - name: valid_from
        data_type: date

      - name: valid_to
        data_type: date

      - name: is_current
        data_type: boolean
        constraints:
          - type: not_null

      - name: row_version
        data_type: integer
        constraints:
          - type: not_null

      - name: is_complete
        data_type: boolean
        constraints:
          - type: not_null

      - name: is_validated
        data_type: boolean
        constraints:
          - type: not_null

      - name: dq_issue_flag
        data_type: boolean
        constraints:
          - type: not_null

      - name: dq_issue_description
        data_type: varchar(500)

      - name: is_deleted
        data_type: boolean
        constraints:
          - type: not_null

      - name: deleted_timestamp
        data_type: timestamp

  # ── gold.dim_store (Type 2 — SCD2, ADR-015) ────────────────────────────────
  - name: dim_store
    description: "Store/location dimension (SCD Type 2). One row per store version; store_state is resolved to the full state name via silver.state. Region/type/name changes version the row for trend continuity."
    config:
      contract:
        enforced: true
    columns:
      - name: store_key
        data_type: integer
        constraints:
          - type: not_null
          - type: primary_key
        data_tests:
          - unique
          - not_null

      - name: store_id
        data_type: varchar(30)
        constraints:
          - type: not_null

      - name: store_name
        data_type: varchar(100)

      - name: store_city
        data_type: varchar(100)

      - name: store_state
        data_type: varchar(50)

      - name: store_region
        data_type: varchar(50)

      - name: store_type
        data_type: varchar(50)

      - name: open_date
        data_type: date

      - name: record_hash
        data_type: char(64)

      - name: source_system
        data_type: varchar(50)

      - name: source_record_id
        data_type: varchar(100)

      - name: etl_batch_id
        data_type: varchar(50)

      - name: etl_load_timestamp
        data_type: timestamp
        constraints:
          - type: not_null

      - name: etl_updated_timestamp
        data_type: timestamp
        constraints:
          - type: not_null

      - name: valid_from
        data_type: date

      - name: valid_to
        data_type: date

      - name: is_current
        data_type: boolean
        constraints:
          - type: not_null

      - name: row_version
        data_type: integer
        constraints:
          - type: not_null

      - name: is_complete
        data_type: boolean
        constraints:
          - type: not_null

      - name: is_validated
        data_type: boolean
        constraints:
          - type: not_null

      - name: dq_issue_flag
        data_type: boolean
        constraints:
          - type: not_null

      - name: dq_issue_description
        data_type: varchar(500)

      - name: is_deleted
        data_type: boolean
        constraints:
          - type: not_null

      - name: deleted_timestamp
        data_type: timestamp

  # ── gold.dim_cashier (Type 2 — SCD2, ADR-015) ──────────────────────────────
  - name: dim_cashier
    description: "Cashier/employee dimension (SCD Type 2). One row per cashier version; the assigned store (code + name) is denormalized from silver.store, so a store reassignment versions the cashier. is_active is a 'Yes'/'No' label per the DDL."
    config:
      contract:
        enforced: true
    columns:
      - name: cashier_key
        data_type: integer
        constraints:
          - type: not_null
          - type: primary_key
        data_tests:
          - unique
          - not_null

      - name: cashier_id
        data_type: varchar(30)
        constraints:
          - type: not_null

      - name: cashier_first_name
        data_type: varchar(50)

      - name: cashier_last_name
        data_type: varchar(50)

      - name: cashier_full_name
        data_type: varchar(100)

      - name: is_active
        data_type: varchar(3)
        data_tests:
          - accepted_values:
              values: ['Yes', 'No']

      - name: store_id
        data_type: varchar(30)

      - name: store_name
        data_type: varchar(100)

      - name: record_hash
        data_type: char(64)

      - name: source_system
        data_type: varchar(50)

      - name: source_record_id
        data_type: varchar(100)

      - name: etl_batch_id
        data_type: varchar(50)

      - name: etl_load_timestamp
        data_type: timestamp
        constraints:
          - type: not_null

      - name: etl_updated_timestamp
        data_type: timestamp
        constraints:
          - type: not_null

      - name: valid_from
        data_type: date

      - name: valid_to
        data_type: date

      - name: is_current
        data_type: boolean
        constraints:
          - type: not_null

      - name: row_version
        data_type: integer
        constraints:
          - type: not_null

      - name: is_complete
        data_type: boolean
        constraints:
          - type: not_null

      - name: is_validated
        data_type: boolean
        constraints:
          - type: not_null

      - name: dq_issue_flag
        data_type: boolean
        constraints:
          - type: not_null

      - name: dq_issue_description
        data_type: varchar(500)

      - name: is_deleted
        data_type: boolean
        constraints:
          - type: not_null

      - name: deleted_timestamp
        data_type: timestamp

  # ── gold.dim_customer (Type 2 — SCD2, ADR-015) ─────────────────────────────
  - name: dim_customer
    description: "Customer dimension (SCD Type 2). One row per customer version; primary address + state name denormalized, first_order_date_key resolved against gold.dim_date. customer_county is 'Not Provided' — no source exists (ADR-014, backlog #3)."
    config:
      contract:
        enforced: true
    columns:
      - name: customer_key
        data_type: integer
        constraints:
          - type: not_null
          - type: primary_key
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_type: varchar(30)
        constraints:
          - type: not_null

      - name: customer_name
        data_type: varchar(100)

      - name: customer_street_address
        data_type: varchar(200)

      - name: customer_city
        data_type: varchar(100)

      - name: customer_county
        data_type: varchar(100)

      - name: customer_state
        data_type: varchar(50)

      - name: customer_city_state
        data_type: varchar(150)

      - name: first_order_date_key
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key

      - name: record_hash
        data_type: char(64)

      - name: source_system
        data_type: varchar(50)

      - name: source_record_id
        data_type: varchar(100)

      - name: etl_batch_id
        data_type: varchar(50)

      - name: etl_load_timestamp
        data_type: timestamp
        constraints:
          - type: not_null

      - name: etl_updated_timestamp
        data_type: timestamp
        constraints:
          - type: not_null

      - name: valid_from
        data_type: date

      - name: valid_to
        data_type: date

      - name: is_current
        data_type: boolean
        constraints:
          - type: not_null

      - name: row_version
        data_type: integer
        constraints:
          - type: not_null

      - name: is_complete
        data_type: boolean
        constraints:
          - type: not_null

      - name: is_validated
        data_type: boolean
        constraints:
          - type: not_null

      - name: dq_issue_flag
        data_type: boolean
        constraints:
          - type: not_null

      - name: dq_issue_description
        data_type: varchar(500)

      - name: is_deleted
        data_type: boolean
        constraints:
          - type: not_null

      - name: deleted_timestamp
        data_type: timestamp

  # ── gold.dim_invoice (Type 2 — SCD2, ADR-015) ──────────────────────────────
  - name: dim_invoice
    description: "Invoice dimension (SCD Type 2, gold decision #2 — standard Type 2 from silver.invoice, not rebuilt from invoice_status_history). Status and total changes drive new versions. po_number added per backlog #10."
    config:
      contract:
        enforced: true
    columns:
      - name: invoice_key
        data_type: integer
        constraints:
          - type: not_null
          - type: primary_key
        data_tests:
          - unique
          - not_null

      - name: invoice_number
        data_type: varchar(30)
        constraints:
          - type: not_null

      - name: po_number
        data_type: varchar(50)

      - name: invoice_date
        data_type: date

      - name: invoice_status
        data_type: varchar(20)
        data_tests:
          - accepted_values:
              values: ['open', 'partial', 'paid', 'void', 'Not Provided']

      - name: invoice_total
        data_type: numeric(12,2)

      - name: customer_id
        data_type: varchar(30)

      - name: customer_name
        data_type: varchar(100)

      - name: store_id
        data_type: varchar(30)

      - name: store_name
        data_type: varchar(100)

      - name: record_hash
        data_type: char(64)

      - name: source_system
        data_type: varchar(50)

      - name: source_record_id
        data_type: varchar(100)

      - name: etl_batch_id
        data_type: varchar(50)

      - name: etl_load_timestamp
        data_type: timestamp
        constraints:
          - type: not_null

      - name: etl_updated_timestamp
        data_type: timestamp
        constraints:
          - type: not_null

      - name: valid_from
        data_type: date

      - name: valid_to
        data_type: date

      - name: is_current
        data_type: boolean
        constraints:
          - type: not_null

      - name: row_version
        data_type: integer
        constraints:
          - type: not_null

      - name: is_complete
        data_type: boolean
        constraints:
          - type: not_null

      - name: is_validated
        data_type: boolean
        constraints:
          - type: not_null

      - name: dq_issue_flag
        data_type: boolean
        constraints:
          - type: not_null

      - name: dq_issue_description
        data_type: varchar(500)

      - name: is_deleted
        data_type: boolean
        constraints:
          - type: not_null

      - name: deleted_timestamp
        data_type: timestamp

  # ── gold.fact_retail_sales (transaction fact — grain: invoice line) ────────
  - name: fact_retail_sales
    description: "Retail sales fact. Grain: one row per invoice line. Loaded incrementally by reload-by-invoice (gold decision #3); dimension keys resolved against the current version with a -1 fallback (ADR-011)."
    config:
      contract:
        enforced: true
    columns:
      - name: sales_line_key
        data_type: integer
        constraints:
          - type: not_null
          - type: primary_key
        data_tests:
          - unique
          - not_null

      - name: date_key
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key

      - name: cashier_key
        data_type: integer
        data_tests:
          - relationships:
              to: ref('dim_cashier')
              field: cashier_key

      - name: product_key
        data_type: integer
        data_tests:
          - relationships:
              to: ref('dim_product')
              field: product_key

      - name: customer_key
        data_type: integer
        data_tests:
          - relationships:
              to: ref('dim_customer')
              field: customer_key

      - name: store_key
        data_type: integer
        data_tests:
          - relationships:
              to: ref('dim_store')
              field: store_key

      - name: invoice_key
        data_type: integer
        data_tests:
          - relationships:
              to: ref('dim_invoice')
              field: invoice_key

      - name: invoice_number
        data_type: varchar(30)

      - name: sales_qty
        data_type: integer

      - name: unit_price
        data_type: numeric(12,2)

      - name: unit_cost
        data_type: numeric(12,2)

      - name: sales_amount
        data_type: numeric(12,2)

      - name: sales_cost
        data_type: numeric(12,2)

      - name: gross_profit
        data_type: numeric(12,2)

      - name: source_system
        data_type: varchar(50)

      - name: source_record_id
        data_type: varchar(100)

      - name: etl_batch_id
        data_type: varchar(50)

      - name: etl_load_timestamp
        data_type: timestamp
        constraints:
          - type: not_null

      - name: etl_updated_timestamp
        data_type: timestamp
        constraints:
          - type: not_null

      - name: is_complete
        data_type: boolean
        constraints:
          - type: not_null

      - name: is_validated
        data_type: boolean
        constraints:
          - type: not_null

      - name: dq_issue_flag
        data_type: boolean
        constraints:
          - type: not_null

      - name: dq_issue_description
        data_type: varchar(500)

  # ── gold.fact_payments (transaction fact — grain: payment) ─────────────────
  - name: fact_payments
    description: "Payments fact. Grain: one row per payment. Refunds are stored NEGATIVE and carry parent_payment_key pointing at the payment they reverse, so SUM(payment_amount) nets automatically — BI must not filter or negate them again (backlog #5). parent_payment_key is resolved in-model via a self-join (ADR-009)."
    config:
      contract:
        enforced: true
    columns:
      - name: payment_key
        data_type: integer
        constraints:
          - type: not_null
          - type: primary_key
        data_tests:
          - unique
          - not_null

      - name: invoice_key
        data_type: integer
        data_tests:
          - relationships:
              to: ref('dim_invoice')
              field: invoice_key

      - name: customer_key
        data_type: integer
        data_tests:
          - relationships:
              to: ref('dim_customer')
              field: customer_key

      - name: payment_method_key
        data_type: integer
        data_tests:
          - relationships:
              to: ref('dim_payment_method')
              field: payment_method_key

      - name: date_key
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key

      - name: payment_type_key
        data_type: integer
        data_tests:
          - relationships:
              to: ref('dim_payment_type')
              field: payment_type_key

      - name: cashier_key
        data_type: integer
        data_tests:
          - relationships:
              to: ref('dim_cashier')
              field: cashier_key

      - name: store_key
        data_type: integer
        data_tests:
          - relationships:
              to: ref('dim_store')
              field: store_key

      - name: parent_payment_key
        data_type: integer

      - name: payment_sequence_num
        data_type: smallint

      - name: payment_amount
        data_type: numeric(12,2)

      - name: tax_amount
        data_type: numeric(12,2)

      - name: fee_amount
        data_type: numeric(12,2)

      - name: net_amount
        data_type: numeric(12,2)

      - name: source_system
        data_type: varchar(50)

      - name: source_record_id
        data_type: varchar(100)

      - name: etl_batch_id
        data_type: varchar(50)

      - name: etl_load_timestamp
        data_type: timestamp
        constraints:
          - type: not_null

      - name: etl_updated_timestamp
        data_type: timestamp
        constraints:
          - type: not_null

      - name: is_complete
        data_type: boolean
        constraints:
          - type: not_null

      - name: is_validated
        data_type: boolean
        constraints:
          - type: not_null

      - name: dq_issue_flag
        data_type: boolean
        constraints:
          - type: not_null

      - name: dq_issue_description
        data_type: varchar(500)

  # ── gold.fact_customer_behavior_snapshot (periodic snapshot fact) ──────────
  - name: fact_customer_behavior_snapshot
    description: "Customer behavior snapshot. Grain: one row per customer per snapshot date. Monthly at month-end (decision #4), append-only — prior snapshots are immutable. Measures are computed as of the snapshot date. Override the date with --vars '{snapshot_date: YYYY-MM-DD}'."
    config:
      contract:
        enforced: true
    columns:
      - name: snapshot_key
        data_type: integer
        constraints:
          - type: not_null
          - type: primary_key
        data_tests:
          - unique
          - not_null

      - name: snapshot_date_key
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key

      - name: customer_key
        data_type: integer
        data_tests:
          - relationships:
              to: ref('dim_customer')
              field: customer_key

      - name: last_order_date_key
        data_type: integer
        data_tests:
          - relationships:
              to: ref('dim_date')
              field: date_key

      - name: lifetime_order_count
        data_type: integer

      - name: lifetime_sales_amount
        data_type: numeric(14,2)

      - name: orders_last_30_days
        data_type: integer

      - name: avg_days_to_full_payment
        data_type: numeric(8,2)

      - name: open_invoice_count
