version: 2

# ── BI serving views (ADR-017) ───────────────────────────────────────────────
# Report-ready views over the gold star, business-named, metric logic encoded
# once. Consumed by Power BI first, then Tableau (same views, different visuals).
# Materialized as views; they read gold only (ADR-001). Each reconciles exactly
# to its underlying fact — verified: row counts and dollar totals match.

models:
  - name: bi_sales
    description: >
      Sales at invoice-line grain, pre-joined to date, product, customer, store
      and cashier with business-friendly names. Includes gross_margin_pct.
      Powers margin-by-department and store-trend reporting.
    columns:
      - name: sale_date
        description: Calendar date of the sale (from dim_date).
        data_tests: [not_null]
      - name: gross_margin_pct
        description: gross_profit / sales_amount as a ratio (0–1); NULL on $0 lines.

  - name: bi_payments
    description: >
      Payments at payment grain, pre-joined to date, customer, store, method and
      type. Refunds are stored NEGATIVE and flagged (is_refund / payment_kind);
      SUM(payment_amount) nets them automatically — split on payment_kind, not the
      sign (backlog #5).
    columns:
      - name: payment_date
        description: Calendar date of the payment (from dim_date).
        data_tests: [not_null]
      - name: is_refund
        description: True when the payment reverses another (parent_payment_key set).

  - name: bi_customer_snapshot
    description: >
      Customer behavior at customer × snapshot-date grain, with both date roles
      resolved (snapshot, last order) and derived days_since_last_order and
      is_at_risk. The at-risk threshold (90 days) is a BI-layer default, open for
      the managers to adjust (ADR-017).
    columns:
      - name: snapshot_date
        description: The month-end this snapshot was taken (from dim_date).
        data_tests: [not_null]
      - name: is_at_risk
        description: >
          Active customer with 0 orders in the last 30 days and >90 days since
          last order. Proposed default; adjustable in bi_customer_snapshot.sql.
